name: Market data replays

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  replay:
    name: ${{ matrix.mode }} replay
    strategy:
      fail-fast: false
      matrix:
        mode: [archives, outage]
    runs-on: ubuntu-24.04
    container: debian:12-slim
    timeout-minutes: 15
    steps:
      - name: Install Python 3.11 and MySQL 8.4
        run: |
          apt-get update -qq
          apt-get install -qy --no-install-recommends ca-certificates curl git python3.11-venv \
            libaio1 libnuma1 libtinfo5 libncurses5 xz-utils
          file=mysql-8.4.0-linux-glibc2.17-x86_64-minimal.tar.xz
          curl -fsSL --retry 3 "https://cdn.mysql.com/archives/mysql-8.4/$file" -o "/tmp/$file"
          echo "d466dd5cf4aea59965b9514b8eecda24cc550a765d43f8c9410868d53bf4aa93  /tmp/$file" | sha256sum -c -
          mkdir /opt/mysql
          tar -xJf "/tmp/$file" --strip-components=1 -C /opt/mysql
          echo /opt/mysql/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the documented replay
        env:
          REPLAY_MODE: ${{ matrix.mode }}
        run: |
          cat /etc/os-release
          uname -m
          python3.11 --version
          mysqld --version
          bash scripts/reproduce.sh "--$REPLAY_MODE"
